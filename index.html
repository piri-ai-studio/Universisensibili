<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6ec">
<title>Libri di Natale · Antonio Catalano</title>
<meta name="description" content="I libri di Natale di Antonio Catalano: Il Vangelo raccontato da un Asino Patentato, Artabàn e altri. Acquista online e vieni a trovarci a Bergamo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE  occasion: a little Christmas bookshop, poetic and warm, Catalano's "meraviglia"
   IDEA   a shelf of books under a starry night of line drawings; each book opens like a page
   PICTURE the covers, large, with reflection and parallax over a hand-drawn sky of stars, comets and huts
   COLOUR warm paper ground, deep fir-green ink, Christmas red action, gold star accent
   TYPE   Young Serif (naive, book-like) + Nunito Sans + Caveat for the handwritten line
   LAYOUT full-screen horizontal shelf; detail: book left / sheet right on wide screens, book top / sheet below on phones */
:root{
  color-scheme:light;
  --bg:#fbf6ec; --ink:#1e3329; --ink-dim:rgba(30,51,41,.68); --ink-faint:rgba(30,51,41,.3);
  --red:#b3261e; --gold:#d4a23a; --green:#2f5d47; --paper:#f3eadb; --line:#e6d9c3;
  --display:"Young Serif",Georgia,serif; --text:"Nunito Sans",system-ui,sans-serif; --script:"Caveat","Segoe Script",cursive;
  --H:min(46dvh,62vw); --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:clip;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{font:400 16px/1.55 var(--text)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
#app{position:fixed;inset:0;overflow:clip;background:var(--bg)}

/* cielo lontano */
.far{position:absolute;top:-6%;bottom:-6%;left:-6%;width:260vw;will-change:transform;transition:filter .9s var(--ease)}
.far svg.room{position:absolute;inset:0;width:100%;height:100%}
.far .tint{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.14;transition:background-color 1.2s var(--ease)}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 75% at 50% 46%,rgba(251,246,236,0) 30%,rgba(251,246,236,.7) 78%,#fbf6ec 100%),linear-gradient(180deg,rgba(251,246,236,.85) 0,rgba(251,246,236,0) 20%,rgba(251,246,236,0) 62%,#fbf6ec 92%)}
#app.detail-open .far{filter:blur(5px) saturate(.8)}
.snow{position:absolute;inset:0;pointer-events:none}
.snow i{position:absolute;top:-4%;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);opacity:.5;animation:fall var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes fall{to{transform:translate3d(var(--x),112dvh,0)}}

/* scaffale */
.scroller{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity;touch-action:pan-x;overscroll-behavior-x:contain}
.scroller.free{scroll-snap-type:none}
.scroller::-webkit-scrollbar{display:none}
.track{position:relative;height:100%;display:flex;align-items:center;padding-top:4dvh;width:max-content}
.item{position:relative;flex:0 0 auto;width:calc(var(--H) * var(--ar) * var(--sc,1) + 16vw);min-width:170px;display:flex;flex-direction:column;align-items:center;scroll-snap-align:center;opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease);will-change:transform,opacity}
.item.in{opacity:1;transform:none}
#app.detail-open .item{opacity:0!important;transform:scale(.96);transition-duration:.45s}
.dolce{position:relative;height:var(--H);width:calc(var(--H) * var(--ar) * var(--sc,1));display:flex;align-items:flex-end;justify-content:center}
.dolce img{display:block;max-height:calc(var(--H) * var(--sc,1));max-width:100%;filter:drop-shadow(0 18px 18px rgba(30,51,41,.22));user-select:none;-webkit-user-drag:none;pointer-events:none;transition:transform .5s var(--ease)}
.item:hover .dolce img{transform:translateY(-6px) rotate(-1.5deg)}
.dolce .refl{display:none}
.dolce.is-hidden img{visibility:hidden}
.tag{position:absolute;z-index:2;top:calc(var(--H) * (1 - var(--sc,1)) - 12px);right:-10px;font:800 11px/1 var(--text);letter-spacing:.06em;background:var(--red);color:#fff;border-radius:99px;padding:7px 10px;transform:rotate(6deg)}
.tag.soon{background:var(--ink-dim)}
.label{position:relative;margin-top:22px;width:100%;max-width:240px;padding:0 4px;text-align:left}
.label .name{display:block;font:400 22px/1.1 var(--display)}
.label .coll{display:block;font:600 13px/1.4 var(--text);color:var(--ink-dim);margin-top:6px}
.rule{display:block;height:1px;background:linear-gradient(90deg,rgba(30,51,41,.9),rgba(30,51,41,.4) 70%,rgba(30,51,41,0));transform-origin:0 50%;transform:rotate(var(--tilt,-.8deg)) scaleX(0);transition:transform 1.1s var(--ease) .25s;margin:9px 0 0}
.item.in .rule{transform:rotate(var(--tilt,-.8deg)) scaleX(1)}

/* cornice */
.chrome{position:absolute;left:0;right:0;pointer-events:none;z-index:5;transition:opacity .5s var(--ease)}
.chrome.top{top:0;padding:calc(var(--safe-t) + clamp(14px,2.4vw,28px)) clamp(18px,3vw,36px) 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{pointer-events:auto;display:block;text-decoration:none}
.brand b{display:block;font:400 clamp(22px,3vw,30px)/1 var(--display)}
.brand span{display:block;font:500 20px/1 var(--script);color:var(--red);margin-top:4px}
.right{display:flex;align-items:center;gap:14px}
.counter{font:400 15px/1 var(--display);color:var(--ink-dim)}
.counter b{font-weight:400;color:var(--ink);font-size:24px}
.cart-chip{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:99px;background:var(--ink);color:var(--bg);font:700 14px/1 var(--text)}
.cart-chip svg{width:18px;height:18px}
.cart-chip output{min-width:20px;height:20px;border-radius:99px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-size:12px;padding:0 5px}
.chrome.bottom{bottom:0;padding:0 clamp(18px,3vw,36px) calc(var(--safe-b) + clamp(14px,2.4vw,26px))}
.now{font:700 13px/1 var(--text);color:var(--ink-dim);display:flex;justify-content:space-between;align-items:center;gap:12px}
.now>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:1px;background:rgba(30,51,41,.14);margin-top:10px;position:relative;overflow:hidden}
.progress i{position:absolute;inset:0;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}
.hint{display:flex;align-items:center;gap:8px;transition:opacity .6s;white-space:nowrap}
.hint svg{animation:nudge 1.8s var(--ease) infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
.dots{pointer-events:auto;display:flex;gap:2px}
.dots button{width:28px;height:28px;display:grid;place-items:center}
.dots button i{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);transition:all .4s var(--ease)}
.dots button.on i{background:var(--ink);width:18px;border-radius:3px}
#app.detail-open .chrome{opacity:0}
#app.detail-open .chrome .cart-chip{pointer-events:none}

/* dettaglio */
.detail{position:absolute;inset:0;z-index:10;pointer-events:none;overflow:clip}
.detail.open{pointer-events:auto}
.d-slot{position:absolute;left:6vw;width:36vw;top:calc(var(--safe-t) + 90px);bottom:calc(var(--safe-b) + 8dvh)}
.d-back{position:absolute;z-index:12;top:calc(var(--safe-t) + clamp(14px,2.4vw,26px));left:clamp(14px,2.4vw,26px);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(30,51,41,.3);background:rgba(251,246,236,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transform:translateX(-10px) rotate(-20deg);transition:opacity .5s var(--ease),transform .6s var(--ease)}
.detail.open .d-back{opacity:1;transform:none;transition-delay:.3s}
.d-info{overflow-x:hidden;position:absolute;top:0;bottom:0;right:0;width:52vw;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-t) + 84px) 6vw calc(var(--safe-b) + 110px) 8px;scrollbar-width:thin;-webkit-mask-image:linear-gradient(180deg,transparent 0,transparent calc(var(--safe-t) + 62px),#000 calc(var(--safe-t) + 96px),#000 calc(100% - 40px),transparent);mask-image:linear-gradient(180deg,transparent 0,transparent calc(var(--safe-t) + 62px),#000 calc(var(--safe-t) + 96px),#000 calc(100% - 40px),transparent)}
.d-info>*{opacity:0;transform:translateX(24px);transition:opacity .6s var(--ease),transform .7s var(--ease)}
.detail.open .d-info>*{opacity:1;transform:none}
.detail.closing .d-info>*{opacity:0;transition-duration:.25s;transition-delay:0s!important}
.d-coll{font:700 14px/1.4 var(--text);color:var(--red)}
.d-name{font:400 clamp(34px,5vw,52px)/1.05 var(--display);margin-top:8px;text-wrap:balance}
.d-info .rule{width:82%;margin-top:16px;transform:rotate(var(--tilt,-.8deg)) scaleX(0)}
.detail.open .d-info .rule{transform:rotate(var(--tilt,-.8deg)) scaleX(1)}
.d-sub{font:600 15px/1.5 var(--text);color:var(--ink-dim);margin-top:12px}
.d-script{font:500 28px/1.15 var(--script);color:var(--red);margin-top:24px}
.d-text{font-size:16.5px;line-height:1.7;margin-top:10px;max-width:62ch}
.d-text+.d-text{margin-top:12px}
.d-text strong{font-weight:800}.d-text em{font-style:italic;color:var(--green)}
.d-h{font:400 22px/1.2 var(--display);margin-top:34px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:12px 22px;border-radius:99px;background:var(--ink);color:var(--bg);font:800 15px/1 var(--text);text-decoration:none;transition:transform .3s var(--ease),background .3s}
.btn:hover{transform:translateY(-2px)}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.pp{background:#ffc439;color:#142c8e}
.btn.off{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.sample{font-size:13px;color:var(--ink-dim);margin-top:12px}
.buy{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:24px;padding:18px 20px;border-radius:20px;background:var(--paper)}
.buy .pr{font:400 38px/1 var(--display);white-space:nowrap}
.buy .pr small{display:block;font:600 12.5px/1.3 var(--text);color:var(--ink-dim);margin-top:4px}
.buy .ctas{margin-top:0}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:99px;background:#fff}
.step button{width:44px;height:44px;font-size:20px;line-height:1}
.step output{min-width:24px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.facts{list-style:none;margin-top:6px}
.facts li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.facts li span:first-child{color:var(--ink-dim)}
.facts li b,.facts li a{text-align:right;font-weight:700;text-decoration:none}

/* carrello e cassa */
.cart-sum{list-style:none;margin-top:6px}
.cart-sum li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.cart-sum li>span:last-child{white-space:nowrap;text-align:right;display:flex;align-items:center;gap:10px}
.cart-sum li.t{font:400 26px/1.2 var(--display);border-bottom:0}
.cart-sum .empty-c{color:var(--ink-dim);justify-content:flex-start}
.cart-sum .step button{width:36px;height:36px;font-size:17px}
.form{display:grid;gap:12px;margin-top:14px}
.f{display:grid;gap:5px;font:700 13px/1.3 var(--text);color:var(--ink-dim)}
.f input,.f textarea{font:400 16px/1.4 var(--text);color:var(--ink);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;width:100%}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;font-size:15px}
.opt input{width:20px;height:20px;accent-color:var(--red);flex:none}
.opt b{display:block}.opt small{color:var(--ink-dim);font-size:13px}
.opt span:last-child{margin-left:auto;font-weight:800;white-space:nowrap}
.notice{margin-top:12px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--gold) 22%,#fff);font-size:14.5px;display:none}
.notice.on{display:block}
.cart-bar{position:absolute;z-index:12;left:max(14px,calc(76% - 260px));right:max(14px,calc(24% - 260px));bottom:calc(var(--safe-b) + 14px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 18px;border-radius:99px;background:rgba(251,246,236,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px -10px rgba(30,51,41,.35),0 0 0 1px var(--line);transform:translateY(16px);opacity:0;pointer-events:none;transition:all .4s var(--ease)}
.cart-bar.on{transform:none;opacity:1;pointer-events:auto}
.cart-bar.on.hide{transform:translateY(16px);opacity:0;pointer-events:none}
.cart-bar span{font-size:14.5px;white-space:nowrap;flex:1;line-height:1.3}

/* appuntamenti */
.events{display:grid;gap:10px;margin-top:12px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start;padding:18px 20px;border:1px solid var(--line);border-radius:18px;background:#fff;text-decoration:none;transition:transform .3s var(--ease),border-color .3s}
.ev:hover{transform:translateX(4px);border-color:var(--ink)}
.ev .when{width:62px;height:66px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-content:center;text-align:center}
.ev .when b{font:400 28px/1 var(--display)}
.ev .when small{font:800 12px/1.2 var(--text);text-transform:uppercase;margin-top:3px}
.ev .what{display:block}
.ev .what i{display:block;font:italic 600 14px/1.3 var(--text);color:var(--red)}
.ev .what>b{display:block;font:400 22px/1.2 var(--display);color:var(--ink);margin:4px 0 10px}
.ev dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14.5px;line-height:1.45}
.ev dt{font:800 12px/1.9 var(--text);color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em}
.ev dd{color:var(--ink)}
.ev dd strong{font-weight:800}
.ev .more{display:inline-block;margin-top:12px;font:800 14px/1.2 var(--text);color:var(--red);text-decoration:underline;text-underline-offset:3px}
@media(max-width:480px){.ev{grid-template-columns:minmax(0,1fr);padding:16px}.ev .when{width:auto;height:auto;display:inline-flex;gap:6px;align-items:baseline;justify-self:start;padding:6px 12px;border-radius:99px}.ev .when b{font-size:20px}.ev dl{grid-template-columns:minmax(0,1fr);gap:0}.ev dt{margin-top:6px}}
.shops{display:grid;gap:10px;margin-top:12px}
.shop-ph{padding:16px;border:1.5px dashed var(--line);border-radius:16px;color:var(--ink-dim);font-size:15px}

.item.photo .dolce img{border-radius:2px 6px 6px 2px;box-shadow:0 1px 0 1px rgba(30,51,41,.08),0 24px 34px -14px rgba(30,51,41,.45);filter:none}
.hero.photo img{object-fit:contain;filter:drop-shadow(0 1px 1px rgba(30,51,41,.25)) drop-shadow(0 26px 26px rgba(30,51,41,.28))}
/* conferma */
.cart-chip.ghosty{background:rgba(251,246,236,.85);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.confirm{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(30,51,41,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .3s}
.confirm.on{opacity:1}
[hidden]{display:none!important}
.cf-card{width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--bg);border-radius:24px;padding:26px 24px 22px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.cf-card .cart-sum{text-align:left}.cf-card .ctas{justify-content:center}
.cf-code{font:400 clamp(40px,11vw,54px)/1 var(--display);letter-spacing:.06em;margin:10px 0 14px;font-variant-numeric:tabular-nums}
.legal-line{margin-top:8px;font:600 11px/1.4 var(--text);color:var(--ink-dim);display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center}
.legal-line button{pointer-events:auto;color:var(--ink);text-decoration:underline;text-underline-offset:2px;padding:4px 0}
.d-legal{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.6;color:var(--ink-dim)}
.d-legal b{color:var(--ink)}
.d-legal button,.chk button{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--ink)}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--red);flex:none}
.legal-card{width:min(680px,100%);text-align:left;padding-bottom:0}
.legal-card h2{font:400 30px/1.15 var(--display)}
.legal-card h3{font:400 20px/1.2 var(--display);margin-top:26px;padding-bottom:6px;border-bottom:1px solid var(--line);scroll-margin-top:10px}
.legal-card h4{font:800 14.5px/1.3 var(--text);margin-top:14px}
.legal-card p,.legal-card li{font-size:14.5px;line-height:1.6;margin-top:6px}
.legal-card ul{padding-left:18px}
.legal-card .modulo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.legal-card .ctas{position:sticky;bottom:0;background:var(--bg);padding:12px 0 18px;margin-top:20px;justify-content:center}
.legal-toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.legal-toc button{font:700 13px/1 var(--text);padding:9px 12px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);background:#fff}
.cf-qr{width:180px;margin:0 auto;padding:8px;background:#fff;border-radius:14px;box-shadow:0 0 0 1px var(--line)}
.cf-qr svg{display:block;width:100%;height:auto}
.cf-how{font-size:15px;line-height:1.55;margin:16px 0 4px;text-align:left}
.cf-demo{font:800 12.5px/1.3 var(--text);background:var(--gold);color:var(--ink);border-radius:10px;padding:8px 10px;margin-bottom:12px}
/* oggetto che vola */
.hero{position:fixed;z-index:11;pointer-events:none;will-change:transform;transform-origin:0 0}
.hero img{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 26px 26px rgba(30,51,41,.25))}
.hero.float img{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px) rotate(.5deg)}}

@media (max-aspect-ratio:1/1){
  :root{--H:min(42dvh,64vw)}
  .cart-bar{left:14px;right:14px}
  .d-slot{left:0;right:0;width:auto;top:calc(var(--safe-t) + 66px);bottom:auto;height:24dvh}
  .d-info{left:0;width:auto;top:calc(var(--safe-t) + 66px + 24dvh);padding:14px 20px calc(var(--safe-b) + 110px);-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 40px),transparent)}
  .two{grid-template-columns:minmax(0,1fr)}
  .counter{display:none}
}
@media (max-width:420px){.cart-chip span{display:none}.dots{display:none}}
@media (prefers-reduced-motion:reduce){
  .hint svg,.hero.float img,.snow i{animation:none}
  .item,.rule,.d-info>*{transition-duration:.01s!important}
}
</style>
</head>
<body>
<div id="app">
  <div class="far" id="far" aria-hidden="true">
    <svg class="room" id="room" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="snow" id="snow"></div>
    <div class="tint" id="tint"></div>
  </div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="scroller" id="scroller" aria-label="I libri di Natale">
    <div class="track" id="track"></div>
  </div>

  <div class="chrome top">

function render(force){

  tX+=(tiltX-tX)*.08;tY+=(tiltY-tY)*.08;
  far.style.transform=`translate3d(${(-sx*farK+tX*16+drift).toFixed(2)}px,${(tY*10).toFixed(2)}px,0)`;
  const c=sx+scroller.clientWidth/2;let k=0,best=1e9;centers.forEach((x,i)=>{const d=Math.abs(x-c);if(d<best){best=d;k=i}});
  if(k!==cur||force===true){cur=k;const p=SEZIONI[k];

  if(openIdx!=null)return;
  if(e.key==="ArrowRight")goTo(Math.min(cur+1,items.length-1));
  if(e.key==="ArrowLeft")goTo(Math.max(cur-1,0));
});
if(!reduce)addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;tiltX=(e.clientX/innerWidth-.5)*-1.4;tiltY=(e.clientY/innerHeight-.5)*-1.2});

/* ---------- carrello ---------- */
let cart={},consegna="ritiro";
try{cart=JSON.parse(localStorage.getItem("catalano-cart")||"{}")||{}}catch(e){cart={}}
const save=()=>{try{localStorage.setItem("catalano-cart",JSON.stringify(cart))}catch(e){}};
const inCart=()=>LIBRI.filter(b=>b.stato==="ok"&&cart[b.id]>0);
const count=()=>inCart().reduce((a,b)=>a+cart[b.id],0);
const subtotal=()=>inCart().reduce((a,b)=>a+b.prezzo*cart[b.id],0);
const total=()=>subtotal()+(consegna==="spedizione"&&count()?NEGOZIO.spedizione:0);
const stepper=id=>`<div class="step"><button type="button" data-minus="${id}" aria-label="Togli una copia">−</button><output data-q="${id}">${cart[id]||0}</output><button type="button" data-plus="${id}" aria-label="Aggiungi una copia">+</button></div>`;
function upd(){
  save();const n=count();
  $("#chipN").textContent=n;
  document.querySelectorAll("[data-q]").forEach(o=>o.textContent=cart[o.dataset.q]||0);
  const bar=$("#cartBar");bar.classList.toggle("on",n>0&&openIdx!=null&&!!$("#checkout"));
  bar.querySelector("span").innerHTML=`<b>${n} ${n===1?"libro":"libri"}</b> · ${eur(total())}`;
  const s=$("#oSum");if(s)s.innerHTML=n?inCart().map(b=>`<li><span>${esc(b.breve)}</span><span>${stepper(b.id)}<b>${eur(b.prezzo*cart[b.id])}</b></span></li>`).join("")
    +(consegna==="spedizione"?`<li><span>Spedizione in Italia</span><span>${eur(NEGOZIO.spedizione)}</span></li>`:`<li><span>Ritiro a Bergamo</span><span>gratis</span></li>`)
    +`<li class="t"><span>Totale</span><span>${eur(total())}</span></li>`:'<li class="empty-c">Il carrello è vuoto: aggiungi un libro.</li>';
  const ad=$("#oAddr");if(ad)ad.hidden=consegna!=="spedizione";
  document.querySelectorAll("[data-pay]").forEach(b=>b.classList.toggle("off",!n));
}

function formErr(){
  const nome=$("#oNome").value.trim(),mail=$("#oMail").value.trim();
  return !nome?"Scrivi nome e cognome.":!/^\S+@\S+\.\S+$/.test(mail)?"Serve un'email valida per la ricevuta.":consegna==="spedizione"&&(!$("#oVia").value.trim()||!$("#oCitta").value.trim())?"Completa l'indirizzo di spedizione.":!$("#oOk").checked?"Per continuare, conferma di aver letto le condizioni di vendita e l'informativa privacy.":"";
}
/* codice d'ordine: CAT- + 4 caratteri senza lettere ambigue (0/O, 1/I) */
function newCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";const r=new Uint32Array(4);crypto.getRandomValues(r);r.forEach(x=>s+=A[x%A.length]);return "CAT-"+s}
function buildOrder(pagamento){
  return {codice:newCode(),data:new Date().toISOString(),nome:$("#oNome").value.trim(),email:$("#oMail").value.trim(),
    telefono:($("#oTel")||{}).value||"",consegna:consegna==="ritiro"?"Ritiro a Bergamo":"Spedizione",
    indirizzo:consegna==="spedizione"?`${$("#oVia").value.trim()}, ${$("#oCitta").value.trim()}`:"",
    righe:inCart().map(b=>({titolo:b.breve,copie:cart[b.id],prezzo:b.prezzo})),copie:count(),totale:+total().toFixed(2),
    pagamento,note:$("#oNote").value.trim(),chiave:NEGOZIO.ordiniChiave};
}
/* invio al foglio Google: text/plain + no-cors, così il browser non blocca la richiesta */
function sendOrder(o){
  if(!NEGOZIO.ordiniURL)return Promise.resolve(false);
  return fetch(NEGOZIO.ordiniURL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)}).then(()=>true,()=>false);
}
function onPaid(pagamento){
  const o=buildOrder(pagamento);
  try{localStorage.setItem("catalano-ultimo-ordine",JSON.stringify({...o,chiave:undefined}))}catch(e){}
  sendOrder(o).then(ok=>{if(!ok){try{const q=JSON.parse(localStorage.getItem("catalano-da-inviare")||"[]");q.push(o);localStorage.setItem("catalano-da-inviare",JSON.stringify(q))}catch(e){}}});
  cart={};upd();showConfirm(o,false);
}
/* riprova a inviare ordini rimasti in sospeso (rete assente al momento del pagamento) */
(function retry(){try{const q=JSON.parse(localStorage.getItem("catalano-da-inviare")||"[]");if(!q.length||!NEGOZIO.ordiniURL)return;
  Promise.all(q.map(sendOrder)).then(r=>{const left=q.filter((_,i)=>!r[i]);localStorage.setItem("catalano-da-inviare",JSON.stringify(left))})}catch(e){}})();
let ppLoading=null;
function loadPayPal(){
  if(window.paypal)return Promise.resolve();
  if(!ppLoading)ppLoading=new Promise((ok,ko)=>{const s=document.createElement("script");s.src=`https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(NEGOZIO.paypalClientId)}&currency=EUR&locale=it_IT&components=buttons,funding-eligibility`;s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
  return ppLoading;
}
function pay(kind){
  const msg=$("#oMsg"),bad=formErr();msg.classList.add("on");
  if(bad){msg.textContent=bad;return}
  if(!NEGOZIO.paypalClientId){
    msg.innerHTML=`Il pagamento online non è ancora attivo: si collega quando il sito va sul dominio. L'ordine di ${count()} ${count()===1?"libro":"libri"} (${eur(total())}) non è stato inviato né addebitato.<br><button class="btn ghost" type="button" data-preview="1" style="margin-top:10px;min-height:40px">Vedi l'anteprima della conferma</button>`;return}
  msg.textContent="Apro il pagamento sicuro…";
  loadPayPal().then(()=>{
    const box=$("#ppBox");box.innerHTML="";
    paypal.Buttons({fundingSource:kind==="carta"?paypal.FUNDING.CARD:paypal.FUNDING.PAYPAL,style:{shape:"pill",label:"pay"},
      createOrder:(d,a)=>a.order.create({purchase_units:[{description:"Libri di Antonio Catalano",amount:{currency_code:"EUR",value:total().toFixed(2)}}]}),
      onApprove:(d,a)=>a.order.capture().then(det=>{box.innerHTML="";msg.classList.remove("on");onPaid(`${kind==="carta"?"Carta":"PayPal"} ${det.id}`)}),
      onCancel:()=>{msg.textContent="Pagamento annullato: il carrello è ancora qui."},
      onError:()=>{msg.textContent="Il pagamento non è andato a buon fine. Riprova o scegli l'altro metodo."}
    }).render(box);msg.textContent="Completa il pagamento qui sotto.";
  },()=>{msg.textContent="Non riesco ad aprire il pagamento. Controlla la connessione e riprova."});
}
/* ---------- conferma con codice e QR ---------- */
function qrSVG(text){
  if(!window.QRGen)return "";
  const q=new QRGen(-1,QRGen.L.M);q.addData(text);q.make();const n=q.getModuleCount(),m=2;let p="";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+=`M${c+m} ${r+m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" role="img" aria-label="QR del codice d'ordine" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#1e3329"/></svg>`;
}

   <p class="d-coll">Ordine confermato · grazie, ${esc(o.nome.split(" ")[0])}!</p>
   <h2 class="cf-code">${esc(o.codice)}</h2>
   <div class="cf-qr">${qrSVG(`${o.codice} · ${o.nome}`)}</div>
   <p class="cf-how">${rit?`<strong>Ritiro a Bergamo.</strong> Mostra questo codice o il QR alla <strong>${esc(NEGOZIO.ritiro)}</strong>, negli orari del Luna Park delle Meraviglie (5 dicembre – 10 gennaio).`
     :`<strong>Spedizione.</strong> Prepariamo il pacco per <em>${esc(o.indirizzo)}</em>: ti scriviamo a <em>${esc(o.email)}</em> quando parte.`}</p>
   <ul class="cart-sum">${o.righe.map(r=>`<li><span>${r.copie} × ${esc(r.titolo)}</span><span>${eur(r.prezzo*r.copie)}</span></li>`).join("")}<li class="t"><span>Pagato</span><span>${eur(o.totale)}</span></li></ul>
   <p class="sample">Fai uno screenshot di questa pagina: è la tua ricevuta di ritiro. La ritrovi anche da «Il mio ordine» in alto.</p>
   <div class="ctas"><button class="btn" type="button" data-closeconf="1">Fatto</button></div>`;
  box.hidden=false;requestAnimationFrame(()=>box.classList.add("on"));box.querySelector("[data-closeconf]").focus();
  $("#lastOrder").hidden=demo;

  <h3 id="lg-condizioni">Condizioni di vendita</h3>

  <h4>3. Ordine e conclusione del contratto</h4><p>Scegli i libri, la modalità di consegna e inserisci i tuoi dati. Prima di pagare devi accettare queste condizioni. Il contratto è concluso quando il pagamento va a buon fine. A quel punto il sito mostra la conferma con il codice d'ordine e il riepilogo, che puoi salvare. Ti mandiamo anche una conferma all'indirizzo email che hai indicato. Il contratto è in lingua italiana.</p>

  ${b.testo.map(t=>`<p class="d-text">${md(t)}</p>`).join("")}
  ${ok?`<h3 class="d-h">Scheda</h3><ul class="facts">
   <li><span>${b.autori?"Autori":"Autore"}</span><b>${esc(b.autori||"Antonio Catalano")}</b></li><li><span>Editore</span><b>${esc(b.editore)}</b></li><li><span>Anno</span><b>${b.anno}</b></li>
   ${b.pagine?`<li><span>Pagine</span><b>${b.pagine}</b></li>`:""}<li><span>Formato</span><b>${esc(b.formato)}</b></li><li><span>ISBN</span><b>${esc(b.isbn)}</b></li></ul>
`:""}
  ${checkout()}${legalFoot()}`;
}
const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const day=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const fmt=d=>`${d.getDate()} ${MESI[d.getMonth()].slice(0,3)}`;
const VIEW_APP=()=>`<p class="d-coll">Natale 2026 · Bergamo Alta</p><h2 class="d-name">Dove trovarci</h2><span class="rule"></span>
  <p class="d-sub">Dal 5 dicembre al 10 gennaio siamo al Monastero del Carmine, con il Teatro tascabile di Bergamo</p>
  <h3 class="d-h">Prossimi appuntamenti</h3>
  <div class="events">${APPUNTAMENTI.map(a=>{const s=day(a.dal),e=day(a.al),same=s.getMonth()===e.getMonth();
   const quando=same?`${s.getDate()}–${e.getDate()} ${MESI[s.getMonth()]}`:`${fmt(s)} → ${fmt(e)}`;
   const row=(k,v)=>v?`<dt>${k}</dt><dd>${v}</dd>`:"";
   return `<a class="ev" href="${esc(a.link)}" target="_blank" rel="noopener">
    <span class="when"><b>${s.getDate()}</b><small>${MESI[s.getMonth()].slice(0,3)}</small></span>
    <span class="what"><i>${esc(a.tipo)}</i><b>${esc(a.titolo)}</b>
     <dl>${row("Quando",`<strong>${esc(quando)}</strong>${a.ora?` · ore <strong>${esc(a.ora)}</strong>`:""}`)}${row("Dove",`<strong>${esc(a.luogo.split(" · ")[0])}</strong>${a.luogo.includes(" · ")?"<br>"+esc(a.luogo.split(" · ").slice(1).join(" · ")):""}`)}${row("Orari",a.orari?a.orari.split(" · ").map(esc).join("<br>"):"")}${row("Biglietti",esc(a.prezzo).replace(/€ (\d+)/g,"<strong>€ $1</strong>"))}</dl>
     <span class="more">Info e biglietti sul sito del Tascabile →</span></span>
    </a>`}).join("")}</div>
  <p class="sample">Orari e biglietti dalla pagina del Teatro tascabile di Bergamo: tocca un appuntamento per aprirla.</p>
  <h3 class="d-h">Dove comprare i nostri libri</h3>
  <div class="shops">${LIBRERIE.length?LIBRERIE.map(l=>`<a class="opt" href="${esc(l.link||"#")}" target="_blank" rel="noopener"><span><b>${esc(l.nome)}</b><small>${esc(l.citta)} · ${esc(l.indirizzo)}</small></span></a>`).join("")
    :'<div class="shop-ph">Stiamo raccogliendo le librerie che hanno i nostri libri: presto le trovi qui. Intanto puoi comprarli online da questo sito, o al Monastero del Carmine durante le giornate di Natale.</div>'}</div>
  <div class="ctas"><button class="btn red" type="button" data-open="vangelo">Vai ai libri</button></div>${legalFoot()}`;

document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");if(go){goTo(+go.dataset.go);return}
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.plus){cart[d.plus]=(cart[d.plus]||0)+1;upd()}
  else if(d.minus){cart[d.minus]=Math.max(0,(cart[d.minus]||0)-1);upd()}
  else if(d.add){if(!cart[d.add])cart[d.add]=1;upd();t.textContent="Nel carrello ✓";setTimeout(()=>{t.textContent="Aggiungi al carrello"},1600)}
  else if(d.pay)pay(d.pay);
  else if(d.preview){if(!formErr())showConfirm(buildOrder("Anteprima"),true)}
  else if(d.closeconf)closeConfirm();
  else if(d.legal)openLegal(d.legal);
  else if(d.jump)openLegal(d.jump);
  else if(d.closelegal)closeLegal();
  else if(d.goto){const el=document.getElementById(d.goto);if(el)info.scrollTo({top:el.offsetTop-80,behavior:reduce?"auto":"smooth"})}
  else if(d.open){const i=SEZIONI.findIndex(s=>s.id===d.open);switchTo(i)}
});
document.addEventListener("change",e=>{if(e.target.name==="consegna"){consegna=e.target.value;upd()}});
try{if(localStorage.getItem("catalano-ultimo-ordine"))$("#lastOrder").hidden=false}catch(e){}
$("#lastOrder").addEventListener("click",()=>{try{const o=JSON.parse(localStorage.getItem("catalano-ultimo-ordine"));if(o)showConfirm(o,false)}catch(e){}});
$("#cartChip").addEventListener("click",async()=>{const i=SEZIONI[cur]&&SEZIONI[cur].book?cur:0;await open(i);const el=$("#checkout");if(el)setTimeout(()=>info.scrollTo({top:el.offsetTop-80,behavior:reduce?"auto":"smooth"}),300)});

/* ---------- apertura: il libro vola a sinistra ---------- */
let openIdx=null,hero=null,busy=false;const DUR=reduce?1:720;
function slotRect(ar){
  const s=slot.getBoundingClientRect();let h=s.height*.92,w=h*ar;
  if(w>s.width*.98){w=s.width*.98;h=w/ar}
  return {left:s.left+(s.width-w)/2,top:s.top+(s.height-h)*.5,width:w,height:h};
}
function placeHero(){const r=slotRect(ratios[openIdx]||.7);Object.assign(hero.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px",transform:"none"})}
function fly(el,from,to){
  const dx=from.left-to.left,dy=from.top-to.top,sx=from.width/to.width,sy=from.height/to.height;
  Object.assign(el.style,{left:to.left+"px",top:to.top+"px",width:to.width+"px",height:to.height+"px",transform:"none"});
  if(reduce||!el.animate||!isFinite(sx)||!isFinite(sy))return Promise.resolve();
  const a=el.animate([{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`},{transform:"none"}],{duration:DUR,easing:"cubic-bezier(.2,.8,.2,1)"});
  return Promise.race([a.finished.catch(()=>{}),new Promise(r=>setTimeout(r,DUR+250))]);
}
const killHeroes=()=>document.querySelectorAll(".hero").forEach(h=>h.remove());
const waitScroll=()=>new Promise(r=>{const t0=performance.now();(function w(){if(!anim||performance.now()-t0>1200)r();else requestAnimationFrame(w)})()});
async function open(i){
  if(busy||openIdx!=null)return;busy=true;const p=SEZIONI[i];
  try{
    if(Math.abs(centers[i]-scroller.clientWidth/2-scroller.scrollLeft)>8){goTo(i);await waitScroll()}
    killHeroes();items.forEach(el=>el.querySelector(".dolce").classList.remove("is-hidden"));
    openIdx=i;
    const box=items[i].querySelector(".dolce"),img=box.querySelector("img"),r0=img.getBoundingClientRect();
    hero=document.createElement("div");hero.className="hero"+(p.photo?" photo":"");hero.innerHTML=`<img src="${p.src}" alt="">`;document.body.appendChild(hero);
    box.classList.add("is-hidden");app.classList.add("detail-open");
    info.innerHTML=p.book?bookView(p.book,i):VIEW_APP();info.scrollTop=0;
    [...info.children].forEach((c,k)=>c.style.transitionDelay=(.18+k*.04)+"s");
    detail.classList.remove("closing");detail.classList.add("open");detail.setAttribute("aria-hidden","false");
    upd();
    history.replaceState(null,"","#"+p.id);
    await fly(hero,r0,slotRect(ratios[i]||.7));
    if(!reduce&&hero)hero.classList.add("float");
    $("#back").focus({preventScroll:true});
  }finally{busy=false}
}
async function close(){
  if(busy||openIdx==null)return;busy=true;const i=openIdx;
  const box=items[i].querySelector(".dolce"),img=box.querySelector("img");
  try{
    detail.classList.add("closing");
    if(hero){hero.classList.remove("float");const from=hero.getBoundingClientRect(),to=img.getBoundingClientRect();app.classList.remove("detail-open");await fly(hero,from,to)}
  }finally{
    app.classList.remove("detail-open");box.classList.remove("is-hidden");killHeroes();hero=null;
    detail.classList.remove("open","closing");detail.setAttribute("aria-hidden","true");$("#cartBar").classList.remove("on","hide");
    openIdx=null;busy=false;history.replaceState(null,"",location.pathname+location.search);
  }
}
async function switchTo(i){await close();goTo(i);await waitScroll();open(i)}
$("#back").addEventListener("click",close);
info.addEventListener("scroll",()=>{const c=document.getElementById("checkout"),bar=$("#cartBar");if(!c||!bar)return;bar.classList.toggle("hide",c.getBoundingClientRect().top<info.getBoundingClientRect().bottom-120)},{passive:true});
$("#home").addEventListener("click",e=>{e.preventDefault();if(openIdx!=null)close();goTo(0)});

/* ---------- avvio ---------- */
upd();layout();
addEventListener("load",()=>{layout();const h=location.hash.slice(1);const i=SEZIONI.findIndex(s=>s.id===h);if(i>=0){goTo(i);setTimeout(()=>open(i),500)}});
}
</script>
</body>
</html>
